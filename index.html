<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Manipulation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1 id="main-heading">DOM Manipulation Demo</h1>
    </header>

    <main>
        <section class="content-section">
            <p id="changeable-text">This text will change when you click the button below.</p>
            <button id="text-changer">Change Text</button>
        </section>

        <section class="content-section">
            <div id="style-demo" class="box">This box will change style</div>
            <button id="style-changer">Change Style</button>
        </section>

        <section class="content-section">
            <div id="element-container">
                <p>Click the button to add/remove elements</p>
            </div>
            <button id="element-toggler">Toggle Element</button>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 DOM Manipulation</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
